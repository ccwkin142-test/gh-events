name: Events Demo 1
on:
  # Event 1
  pull_request:
    # The "types" keyword specifies a list of activity types from the pull_request event which triggers the workflow
    types:
      - opened
    # Filter Event 1 based on pull requests on specific branches
    branches:
      # Only pushes to the branches defined in the list trigger the workflow
      - main
      - 'dev-*' # dev-new dev-this-is-new
      - 'feature/**' # feature/new feature/new/button
  # Event 2
  workflow_dispatch:
  # Event 3
  push:
    # Filter Event 3 based on pushing to specific branches but which did not change any files in the specified folder defined in paths-ignore
    branches:
      # Only pushes to the branches defined in the list trigger the workflow
      - main
      - 'dev-*' # dev-new dev-this-is-new
      - 'feature/**' # feature/new feature/new/button
    paths-ignore:
      - '.github/workflows/*'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying..."
